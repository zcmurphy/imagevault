<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoVault</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236495ed'/><text x='50%25' y='55%25' text-anchor='middle' dominant-baseline='middle' font-size='18' fill='white'>◫</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f2f4f7; font-family: sans-serif; }
    #root { min-height: 100vh; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #f2f4f7; gap: 16px; z-index: 9999;
    }
    #loading .logo {
      width: 48px; height: 48px; border-radius: 12px; background: #6495ed;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; color: #fff; box-shadow: 0 4px 16px rgba(100,149,237,0.4);
    }
    #loading .title  { font-size: 20px; font-weight: 700; color: #1c2133; }
    #loading .spinner {
      width: 28px; height: 28px; border: 3px solid #dce8fb;
      border-top-color: #6495ed; border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    #loading .msg { font-size: 13px; color: #8e9ab0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div class="logo">◫</div>
    <div class="title">PhotoVault</div>
    <div class="spinner"></div>
    <div class="msg">Loading application…</div>
  </div>

  <div id="root"></div>

  <!--
    Scripts at end of body — guaranteed to execute in order after DOM is ready.
    React and ReactDOM load as UMD globals (window.React / window.ReactDOM).
    Babel loads next, then our inline script runs last.
  -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js" crossorigin></script>

  <script>
    Babel.registerPreset("app", {
      presets: [
        [Babel.availablePresets["env"], {
          targets: { esmodules: true },
          modules: false,
        }],
        [Babel.availablePresets["react"], {
          runtime: "classic",
        }],
      ],
    });

    async function loadApp() {
      // 1. Fetch JSX source
      const res = await fetch("./photovault.jsx");
      if (!res.ok) throw new Error(
        `Failed to load photovault.jsx: ${res.status} ${res.statusText}`
      );
      const source = await res.text();

      // 2. Transpile JSX → JS
      const { code } = Babel.transform(source, {
        presets:    ["app"],
        filename:   "photovault.jsx",
        sourceType: "module",
      });

      // 3. Strip react/react-dom import statements — already on window.*
      let patched = code
        .replace(/^\s*import\s+.*?from\s+['"]react['"]\s*;?\s*$/gm, "")
        .replace(/^\s*import\s+.*?from\s+['"]react-dom[\w/]*['"]\s*;?\s*$/gm, "");

      // 4. Inject React globals into the blob's isolated ES module scope
      patched = `
const React    = window.React;
const ReactDOM = window.ReactDOM;
const { useState, useEffect, useRef, useCallback, useMemo, useContext, useReducer } = window.React;
` + patched;

      // 5. Import the blob module and mount the app
      const blob    = new Blob([patched], { type: "application/javascript" });
      const blobUrl = URL.createObjectURL(blob);
      const mod     = await import(blobUrl);
      URL.revokeObjectURL(blobUrl);

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(mod.default));

      document.getElementById("loading").style.display = "none";
    }

    loadApp().catch(err => {
      document.getElementById("loading").innerHTML = `
        <div style="text-align:center;padding:40px;max-width:500px">
          <div style="font-size:36px;margin-bottom:16px">⚠</div>
          <div style="font-size:18px;font-weight:700;color:#1c2133;margin-bottom:8px">Failed to load PhotoVault</div>
          <div style="font-size:13px;color:#526080;margin-bottom:20px;line-height:1.6">${err.message}</div>
          <div style="font-size:12px;color:#8e9ab0;line-height:1.6">
            Make sure <code style="background:#eef0f4;padding:2px 6px;border-radius:4px">photovault.jsx</code>
            is in the same folder and the site is served over HTTPS.
          </div>
          <button onclick="location.reload()"
            style="margin-top:20px;padding:9px 20px;background:#6495ed;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">
            Retry
          </button>
        </div>
      `;
    });
  </script>

</body>
</html>
